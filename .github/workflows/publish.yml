name: publish

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: corepack enable
      # Trusted publishing requires npm CLI >= 11.5.1 (Node 22 ships npm 10).
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      # workspace 包互相经 dist 入口解析，测试前必须先构建
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm gate:release
      - run: pnpm gate:install
      - run: npm publish --provenance --access public
        working-directory: apps/cli

  windows-portable:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm gate:portable:win
      - run: node scripts/publish-windows-portable.mjs
        env:
          GH_TOKEN: ${{ github.token }}
