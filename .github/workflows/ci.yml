name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  gates:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # v5 auto-cache looks for pnpm before corepack enable; keep install via corepack.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # workspace 包互相经 dist 入口解析，测试前必须先构建
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm gate:release
      - if: runner.os == 'Windows'
        run: pnpm gate:portable:win
